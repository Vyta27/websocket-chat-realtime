<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Real-Time - WebSocket Experiment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #e5ddd5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .header {
      background: #075e54;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h2 { font-size: 1.1em; }
    #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
    #status-dot.connected { background: #25D366; }
    #status-text { font-size: 0.8em; opacity: 0.8; }

    .username-bar {
      background: #f0f0f0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85em;
      color: #555;
    }
    .username-bar input {
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9em;
    }

    #chat-box {
      height: 380px;
      overflow-y: auto;
      padding: 16px;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg-wrapper { display: flex; }
    .msg-wrapper.own { justify-content: flex-end; }
    .msg {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9em;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.chat-other { background: white; border-radius: 0 10px 10px 10px; }
    .msg.chat-own { background: #dcf8c6; border-radius: 10px 0 10px 10px; }
    .msg.system {
      background: rgba(0,0,0,0.08);
      color: #555;
      font-style: italic;
      font-size: 0.8em;
      text-align: center;
      align-self: center;
      border-radius: 10px;
    }
    .msg .meta { font-size: 0.72em; color: #888; margin-bottom: 2px; font-weight: bold; }
    .msg .time { font-size: 0.7em; color: #aaa; text-align: right; margin-top: 2px; }

    .input-area {
      padding: 12px 16px;
      background: #f0f0f0;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #msg-input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 20px;
      font-size: 0.9em;
      outline: none;
      background: white;
    }
    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #075e54;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.1em;
    }
    #send-btn:hover { background: #128c7e; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div id="status-dot"></div>
      <div>
        <h2>💬 Chat Real-Time WebSocket</h2>
        <div id="status-text">Menghubungkan...</div>
      </div>
    </div>

    <div class="username-bar">
      👤 Username kamu:
      <input type="text" id="username" value="Pengguna1" maxlength="20">
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
      <input type="text" id="msg-input" placeholder="Ketik pesan..." autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const ws = new WebSocket('ws://localhost:8080');
    const chatBox = document.getElementById('chat-box');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    ws.onopen = () => {
      statusDot.classList.add('connected');
      statusText.textContent = 'Terhubung';
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const myUsername = document.getElementById('username').value;

      const wrapper = document.createElement('div');
      wrapper.classList.add('msg-wrapper');

      const div = document.createElement('div');

      if (data.type === 'system') {
        div.classList.add('msg', 'system');
        div.textContent = data.text;
        chatBox.appendChild(div);
      } else {
        const isOwn = data.username === myUsername;
        wrapper.classList.toggle('own', isOwn);
        div.classList.add('msg', isOwn ? 'chat-own' : 'chat-other');
        div.innerHTML = `
          ${!isOwn ? `<div class="meta">${data.username}</div>` : ''}
          ${data.text}
          <div class="time">${data.time}</div>
        `;
        wrapper.appendChild(div);
        chatBox.appendChild(wrapper);
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    };

    ws.onclose = () => {
      statusDot.classList.remove('connected');
      statusText.textContent = 'Terputus dari server';
    };

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const username = document.getElementById('username').value || 'Anonim';
      const text = input.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ username, text }));
      input.value = '';
    }

    document.getElementById('msg-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
